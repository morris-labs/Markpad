<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: mdimg:; style-src 'self' 'unsafe-inline'"
    />
    <title>Markpad</title>
  </head>
  <body>
    <header id="toolbar" role="toolbar" aria-label="Formatting"></header>
    <div id="context-bar" role="toolbar" aria-label="Table and code block"></div>
    <nav id="tab-bar" role="tablist" aria-label="Open documents"></nav>
    <main id="workspace">
      <aside id="outline" hidden aria-label="Outline"></aside>
      <div id="documents"></div>
    </main>
    <footer id="status-bar">
      <span class="status-path"></span>
      <span class="status-words"></span>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
